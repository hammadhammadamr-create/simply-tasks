<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Rating box</title>
</head>
<body>
    <div id="box">
        <div id="rate">
            
        </div>

        <div id="stars">
            <button value="Very poor"><i class="fas fa-star"></i></button>
            <button value="Poor"><i class="fas fa-star"></i></button>
            <button value="Good"><i class="fas fa-star"></i></button>
            <button value="Very good"><i class="fas fa-star"></i></button>
            <button value="Excellent"><i class="fas fa-star"></i></button>
        </div>
    </div>

    <script src="js.js"></script>
</body>
</html>
