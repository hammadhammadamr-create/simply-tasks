<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Submit form</title>
</head>
<body>
    <form id="form">
        <h1 style="color: red; align-self: center; margin: 40px 0;">Job Application Form</h1>

        <label for="name">Fullname</label>
        <input type="text" id="fullName" placeholder="inter name">
        <p class="error" id="nameError"></p>

        <label for="email">Email</label>
        <input type="text" id="email" placeholder="inter email">
        <p class="error" id="emailError"></p>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="inter phone">
        <p class="error" id="phoneError"></p>

        <label for="date">Date</label>
        <input type="date" id="date">
        <p class="error" id="dateError"></p>

        <div id="gender">
            <label for="male">Male</label>
            <input type="radio" id="male">

            <label for="female">Female</label>
            <input type="radio" id="female">
        </div>
        <p class="error" id="genderError"></p>

        <label for="job">Job title</label>
        <select name="job" id="job">
            <option value="">Select</option>
            <option value="devolper">Devoloper</option>
            <option value="designer">Designer</option>
            <option value="machine">Machine learning</option>
        </select>
        <p class="error" id="jobError"></p>

        <label for="Cover">Cover Letter (Optional)</label>
        <textarea name="Cover" id="cover" placeholder="Write your cover letter..."></textarea>

        <button type="submit">Submit Application</button>
    </form>

    <script src="js.js"></script>
</body>
</html>
