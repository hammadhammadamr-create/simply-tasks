<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>task</title>
</head>
<body>
    <header>
        <h1 class="pricing">OUR PRICING PLAN</h1>
    </header>

    <main>
        <section class="first card">
            <div class="top1 cards">
                <h1>Basic</h1>
            </div>

            <h1 class="title1"><sup>$</sup>0 USD / Month</h1>

            <div class="content">
                <p class="text">50 Product</p>
                <p class="text">2 Email accounts</p>
                <p class="text">2 GB BandWidth</p>
                <p class="text">20 GB Storage</p>
            </div>

            <button class="first-btn">Select</button>
        </section>

        <section class="second card">
            <div class="top2 cards">
                <h1>Standard</h1>
            </div>

            <h1 class="title2"><sup>$</sup>50 USD / Month</h1>

            <div class="content">
                <p class="text">150 Product</p>
                <p class="text">5 Email accounts</p>
                <p class="text">5 GB BandWidth</p>
                <p class="text">50 GB Storage</p>
            </div>

            <button class="second-btn">Select</button>
        </section>

        <section class="third card">
            <div class="top3 cards">
                <h1>Premium</h1>
            </div>

            <h1 class="title3"><sup>$</sup>100 USD / Month</h1>

            <div class="content">
                <p class="text">+300 Product</p>
                <p class="text">10 Email accounts</p>
                <p class="text">10 GB BandWidth</p>
                <p class="text">100 GB Storage</p>
            </div>

            <button class="third-btn">Select</button>
        </section>
    </main>
</body>
</html>
